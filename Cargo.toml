[package]
name = "lucienne"
version = "0.1.0"
description = "Kaimono desktop store, rendered from the original Django templates"
edition = "2021"
rust-version = "1.77"

[dependencies]
axum = "0.7"
minijinja = { version = "2", features = ["json"] }
mime_guess = "2"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tower-http = { version = "0.6", features = ["cors"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
